[package]
name = "uniqr"
version = "0.1.1"
edition = "2024"
rust-version = "1.99"
description = "A fast, compatible Rust port of macOS uniq: report or filter out repeated lines"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mkjt2/uniqr"
readme = "README.md"
keywords = ["cli", "uniq", "macos", "text", "coreutils"]
categories = ["command-line-utilities"]
include = ["src/**/*", "cli.toml", "Cargo.toml", "Cargo.lock", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE", "NOTICE"]

[[bin]]
name = "uniqr"
path = "src/main.rs"

[dependencies]
libc = "0.2.191"
memchr = "2.8.3"

# clap and friends render --help, the man page and completions at development
# time (examples/generate.rs); they never reach the shipped binary.
[dev-dependencies]
assert_cmd = "2.2.2"
clap = { version = "4.6.7", features = ["string", "wrap_help"] }
clap_complete = "4.6.11"
clap_mangen = "0.3.3"
insta = "1.49.0"
predicates = "3.1.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
toml = "1.1.8"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev.package]
insta.opt-level = 3
